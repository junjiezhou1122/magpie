<main><h1>#784 界面预览</h1><p class="m">commit e76edbb · <a href="https://github.com/yetone/magpie/pull/784">回到 PR</a> · 「用量 › 请求」和「路由」两页各新增了一个「调用用途」筛选（把 agent 记录的各种 kind 归并成统一用途，如未标记、标题、子代理等）来过滤请求；路由页的统计、失败请求入口和最新请求故事也改为跟随所选用途，未筛选时仍显示网关累计值。用途目录改由 usage.PurposeKinds 生成 purposes.js。</p>
